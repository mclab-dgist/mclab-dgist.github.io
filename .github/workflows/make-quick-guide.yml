name: Generate MCLab quick PDF guide
on:
  push:
    branches: [main]
    paths:
      - "mclab/scripts/make_quick_guide.py"
      - ".github/workflows/make-quick-guide.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean font and PDF library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install --user reportlab
      - name: Create PDF
        run: python mclab/scripts/make_quick_guide.py
      - name: Save PDF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MCLab_홈페이지_업데이트_간편매뉴얼.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish concise Korean MCLab website editing PDF"
            git push origin HEAD:main
          fi
