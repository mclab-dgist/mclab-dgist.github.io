name: Crop research topic images
on:
  push:
    branches: [main]
    paths:
      - '.github/mclab/crop_research_figures.py'
      - '.github/workflows/crop-research-figures.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Crop research images conservatively
        run: python .github/mclab/crop_research_figures.py
      - name: Commit updated research figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'mclab/content/research/*/figure.webp'
          if ! git diff --cached --quiet; then
            git commit -m 'images: crop research figure margins and isolated headers'
            git push
          fi
