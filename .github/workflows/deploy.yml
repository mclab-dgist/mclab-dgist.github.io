name: Install and deploy MCLab

on:
  push:
    branches: [main]
    paths:
      - "MCLab_Original_Photos_No_Teaching.zip"
      - "mclab/**"
      - ".github/mclab/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mclab-install-and-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test safe package installer
        run: python3 -m unittest discover -s .github/mclab -p 'test_*.py' -v
      - name: Import approved package once
        id: package
        run: python3 .github/mclab/import_package.py
      - name: Explain initial upload requirement
        if: steps.package.outputs.ready != 'true'
        run: |
          echo '## MCLab package not uploaded yet' >> "$GITHUB_STEP_SUMMARY"
          echo 'Upload MCLab_Original_Photos_No_Teaching.zip to the repository root on main. Do not unzip or rename it.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No existing website files or published pages have been replaced.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate website content and images
        if: steps.package.outputs.ready == 'true'
        working-directory: mclab
        run: python3 -m unittest discover -s tests -v
      - name: Encode research videos for desktop and mobile browsers
        if: steps.package.outputs.ready == 'true'
        working-directory: mclab
        run: |
          set -euo pipefail
          mkdir -p assets/video/research
          for video in SBW DualSbW; do
            input="content/research/human-machine/${video}.mp4"
            output="assets/video/research/${video}.mp4"
            test -s "$input"
            ffmpeg -hide_banner -loglevel error -nostdin -y -i "$input" \
              -map 0:v:0 -map '0:a?' \
              -vf "scale=w='min(1920,iw)':h='min(1080,ih)':force_original_aspect_ratio=decrease:force_divisible_by=2" \
              -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -movflags +faststart "$output"
            test -s "$output"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of default=noprint_wrappers=1 "$output"
          done
      - name: Build website from content folders
        if: steps.package.outputs.ready == 'true'
        working-directory: mclab
        run: python3 scripts/build_site.py
      - name: Block regressions against approved MCLab website baseline
        if: steps.package.outputs.ready == 'true'
        working-directory: mclab
        run: python3 scripts/verify_approved_release.py
      - name: Commit imported source for future folder updates
        if: steps.package.outputs.imported == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mclab
          if ! git diff --cached --quiet; then
            git commit -m 'feat: Install original-photo MCLab website without Teaching'
            git push origin HEAD:main
          fi
      - name: Publish verified website to existing gh-pages branch
        if: steps.package.outputs.ready == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: mclab/_site
          clean: true
      - name: Explain content management
        if: steps.package.outputs.ready == 'true'
        run: |
          echo '## MCLab website built and gh-pages updated' >> "$GITHUB_STEP_SUMMARY"
          echo 'Edit mclab/content/people, mclab/content/publications, or mclab/content/projects and commit to main for future updates.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The initial ZIP is not re-imported over your edits. Teaching is excluded from the generated website.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Confirm the public URL in Settings > Pages. This workflow uses the existing gh-pages branch deployment method.' >> "$GITHUB_STEP_SUMMARY"
